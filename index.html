<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vtwin</title>
    <script>
      (function () {
        var w = window.innerWidth;
        document.documentElement.dataset.layout =
          w <= 1099 ? "compact" : w <= 1279 ? "narrow" : w <= 1439 ? "medium" : "wide";
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <nav id="module-nav" class="module-nav" aria-label="Módulos"></nav>

      <div class="app-main">
      <header id="header" class="app-header">
        <div class="header-left">
          <button
            type="button"
            class="icon-btn-plain header-menu"
            id="btn-nav-menu"
            title="Menu"
            aria-label="Menu"
            aria-controls="module-nav"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M5 7h14M5 12h14M5 17h14" stroke-linecap="round" />
            </svg>
          </button>
          <div class="header-project-wrap">
          <button type="button" class="header-project" id="btn-open-ifc" title="Abrir IFC" aria-haspopup="dialog" aria-expanded="false" aria-controls="model-popover">
            <span class="file-ext">IFC</span>
            <span id="file-name" class="file-name">Abrir modelo</span>
            <svg class="header-project-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="model-popover" class="model-popover" hidden></div>
          </div>
        </div>

        <div class="header-center" aria-live="polite">
          <span id="current-date" class="sim-date">—</span>
          <span id="cost-5d" class="sim-cost">—</span>
        </div>

        <div class="header-right">
          <input type="file" id="ifc-file-input" class="sr-only" accept=".ifc,.IFC" multiple />
          <input
            type="file"
            id="plan-file-input"
            class="sr-only"
            accept=".csv,.xml,.mpp,.pdf,.txt,.CSV,.XML,.MPP,.PDF,.TXT"
            multiple
          />
          <button type="button" class="icon-btn-plain" id="btn-import" title="Abrir" aria-label="Abrir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M12 16V4" stroke-linecap="round" />
              <path d="M8 8l4-4 4 4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M5 19h14" stroke-linecap="round" />
            </svg>
            <span id="btn-import-label" class="sr-only">Abrir</span>
          </button>
          <button
            type="button"
            class="icon-btn-plain"
            id="btn-export"
            title="Exportar"
            aria-label="Exportar"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M12 4v10" stroke-linecap="round" />
              <path d="M8 11l4 4 4-4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M5 19h14" stroke-linecap="round" />
            </svg>
            <span id="btn-export-label" class="sr-only">Exportar</span>
          </button>
          <button type="button" class="icon-btn-plain" id="btn-share" title="Partilhar" aria-label="Partilhar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="18" cy="5" r="2.4" />
              <circle cx="6" cy="12" r="2.4" />
              <circle cx="18" cy="19" r="2.4" />
              <path d="M8.2 13.2l7.6 4.2M15.8 6.6l-7.6 4.2" />
            </svg>
            <span id="btn-share-label" class="sr-only">Partilhar</span>
          </button>
        </div>
      </header>

      <div id="shell-scrim" class="shell-scrim" hidden></div>

      <div class="body-grid">
        <aside id="sidebar" class="panel panel-schedule">
          <div class="panel-head">
            <div class="panel-head-row">
              <h2 class="panel-title">4D</h2>
              <span class="panel-badge" id="schedule-count">—</span>
              <button
                type="button"
                class="panel-collapse"
                id="toggle-schedule"
                title="Ocultar"
                aria-label="Ocultar"
                aria-controls="sidebar"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M14 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
            <p class="panel-sub" id="schedule-name">—</p>
          </div>

          <div class="panel-toolbar">
            <label class="sr-only" for="task-search">Filtrar tarefas</label>
            <div class="search-field">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" />
                <path d="M16 16l4 4" stroke-linecap="round" />
              </svg>
              <input
                type="search"
                id="task-search"
                class="search-input"
                placeholder="Filtrar"
                autocomplete="off"
              />
            </div>
          </div>

          <div id="task-tree" class="task-tree"></div>
          <div id="logistics-panel" class="logistics-panel" hidden></div>
          <div
            class="split-handle split-handle-end"
            id="split-schedule"
            role="separator"
            aria-orientation="vertical"
            aria-label="Largura do cronograma"
            title="Arraste para redimensionar. Duplo clique restaura."
            tabindex="0"
          ></div>
        </aside>

        <section class="center-column">
          <section id="module-placeholder" class="module-placeholder" hidden aria-live="polite"></section>
          <section id="project-workspace" class="project-workspace" aria-label="Planejamento de projeto"></section>
          <div
            class="split-handle split-handle-grid"
            id="split-gantt-view"
            role="separator"
            aria-orientation="vertical"
            aria-label="Largura do Gantt"
            title="Arraste para redimensionar. Duplo clique restaura."
            tabindex="0"
          ></div>
          <div id="viewport-wrapper" class="viewport-shell">
            <div class="viewport-stage">
                <div class="viewport-hud" aria-hidden="false">
                <div class="viewport-toolbar" role="toolbar" aria-label="Visualização">
                  <button
                    type="button"
                    class="icon-btn icon-btn-toggle is-active"
                    id="btn-hud-cost"
                    aria-label="5D"
                    aria-pressed="true"
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <path d="M5 19V9M10 19V5M15 19v-7M20 19V8" stroke-linecap="round"/>
                    </svg>
                  </button>
                  <button
                    type="button"
                    class="icon-btn icon-btn-toggle"
                    id="btn-earth"
                    title="Terreno"
                    aria-label="Terreno"
                    aria-pressed="false"
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <circle cx="12" cy="12" r="9" />
                      <path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18" />
                    </svg>
                  </button>
                  <button
                    type="button"
                    class="icon-btn icon-btn-toggle"
                    id="btn-earth-settings"
                    title="Posição"
                    aria-label="Posição"
                    aria-pressed="false"
                    hidden
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <circle cx="12" cy="12" r="3" />
                      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
                    </svg>
                  </button>
                  <button
                    type="button"
                    class="icon-btn icon-btn-toggle"
                    id="btn-walk"
                    title="Andar"
                    aria-label="Andar"
                    aria-pressed="false"
                    disabled
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <circle cx="12" cy="6.2" r="2.1" />
                      <path d="M12 8.6v5.2M12 13.8l-3.2 5.2M12 13.8l3.2 5.2M8.6 11.2h6.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </button>
                  <div class="viewport-toolbar-split plan-link-tools" role="group" aria-label="Ligar elementos às tarefas">
                    <button
                      type="button"
                      class="icon-btn icon-btn-toggle"
                      id="btn-box-select"
                      title="Caixa"
                      aria-label="Caixa"
                      aria-pressed="false"
                    >
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <rect x="5" y="5" width="14" height="14" rx="1.5" stroke-dasharray="3 2"/>
                      </svg>
                    </button>
                    <button type="button" class="icon-btn" id="btn-new-set" title="Conjunto" aria-label="Conjunto">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <rect x="4" y="7" width="16" height="12" rx="2"/>
                        <path d="M8 7V5h8v2M12 11v6M9 14h6" stroke-linecap="round"/>
                      </svg>
                    </button>
                    <button type="button" class="icon-btn" id="btn-assign-set" title="Ligar" aria-label="Ligar">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <path d="M8 12h8M12 8v8" stroke-linecap="round"/>
                        <rect x="4" y="4" width="16" height="16" rx="3"/>
                      </svg>
                    </button>
                  </div>
                  <button type="button" class="icon-btn" id="btn-fit" title="Enquadrar modelo (F)" aria-label="Enquadrar modelo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </button>
                </div>
              </div>

              <div id="viewport" class="viewport-canvas"></div>
              <p id="link-mode-hint" class="link-mode-hint" hidden></p>
              <div id="walk-overlay" class="walk-overlay" hidden>
                <div class="walk-crosshair" aria-hidden="true"></div>
                <p class="walk-hint" id="walk-hint">WASD · Esc · V</p>
              </div>
              <div id="sim-hud" class="sim-hud is-idle"></div>

              <aside id="earth-panel" class="earth-panel is-hidden" aria-label="Posicionar modelo no globo">
                <div
                  class="split-handle split-handle-start"
                  id="split-earth"
                  role="separator"
                  aria-orientation="vertical"
                  aria-label="Largura do painel de posição"
                  title="Arraste para redimensionar. Duplo clique restaura."
                  tabindex="0"
                ></div>
                <header class="earth-panel-head">
                  <div class="earth-panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <circle cx="12" cy="12" r="9" />
                      <path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18" />
                    </svg>
                    <div>
                      <span>Posição</span>
                      <small id="ep-source"></small>
                    </div>
                  </div>
                  <button type="button" class="earth-panel-close" id="earth-panel-close" aria-label="Ocultar painel" title="Ocultar painel — o terreno continua visível">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
                    </svg>
                  </button>
                </header>
                <div class="earth-panel-body">
                  <section class="ep-section">
                    <h3 class="ep-section-title">Locais</h3>
                    <div class="ep-presets" role="group" aria-label="Locais sugeridos">
                      <button type="button" class="ep-chip" data-lat="-23.5614" data-lon="-46.6559" data-alt="760">Av. Paulista</button>
                      <button type="button" class="ep-chip" data-lat="-22.9519" data-lon="-43.2105" data-alt="0">Pão de Açúcar</button>
                      <button type="button" class="ep-chip" data-lat="-15.7975" data-lon="-47.8919" data-alt="1100">Brasília</button>
                    </div>
                  </section>

                  <section class="ep-section">
                    <div class="ep-row">
                      <label for="ep-paste">Maps</label>
                      <input
                        id="ep-paste"
                        class="ep-text"
                        type="text"
                        placeholder="−23.56, −46.65"
                        autocomplete="off"
                      />
                    </div>
                    <div class="ep-grid">
                      <div class="ep-row">
                        <label for="ep-lat">Latitude</label>
                        <input id="ep-lat" class="ep-num" type="number" step="0.000001" />
                      </div>
                      <div class="ep-row">
                        <label for="ep-lon">Longitude</label>
                        <input id="ep-lon" class="ep-num" type="number" step="0.000001" />
                      </div>
                    </div>
                  </section>

                  <section class="ep-section">
                    <h3 class="ep-section-title">Gizmo</h3>
                    <div class="ep-mode" role="group" aria-label="Gizmo">
                      <button type="button" class="ep-mode-btn" id="ep-mode-move" data-mode="translate" aria-pressed="false">Mover</button>
                      <button type="button" class="ep-mode-btn" id="ep-mode-rotate" data-mode="rotate" aria-pressed="false">Rotacionar</button>
                      <button type="button" class="ep-mode-btn ep-mode-reset" id="ep-reset-xform">Zerar</button>
                    </div>
                    <div class="ep-grid ep-grid-3">
                      <div class="ep-row">
                        <label for="ep-x">X</label>
                        <input id="ep-x" class="ep-num" type="number" step="0.1" />
                      </div>
                      <div class="ep-row">
                        <label for="ep-y">Y modelo</label>
                        <input id="ep-y" class="ep-num" type="number" step="0.1" />
                      </div>
                      <div class="ep-row">
                        <label for="ep-z">Z</label>
                        <input id="ep-z" class="ep-num" type="number" step="0.1" />
                      </div>
                    </div>
                    <div class="ep-row">
                      <div class="ep-label-row">
                        <label for="ep-yaw-num">Rotação</label>
                        <span class="ep-unit">°</span>
                      </div>
                      <div class="ep-slider-row">
                        <input id="ep-yaw-range" class="ep-range" type="range" min="-180" max="180" step="0.5" />
                        <input id="ep-yaw-num" class="ep-num ep-num-sm" type="number" step="0.5" />
                      </div>
                    </div>
                  </section>

                  <section class="ep-section">
                    <div class="ep-row">
                      <div class="ep-label-row">
                        <label for="ep-terrain-y">Terreno Google</label>
                        <span class="ep-unit">m · Y</span>
                      </div>
                      <p class="ep-terrain-hint">Sobe ou desce só a malha. O IFC (Y modelo) não acompanha.</p>
                      <div class="ep-terrain-row">
                        <input id="ep-terrain-y" class="ep-num" type="number" step="0.1" value="0" />
                        <button type="button" id="ep-snap" class="ep-btn ep-btn-ghost" title="Põe o chão Google em Y=0, sem mexer no modelo">Assentar</button>
                      </div>
                      <span id="ep-terrain" class="ep-terrain-val">a amostrar…</span>
                    </div>
                    <div class="ep-row">
                      <div class="ep-label-row">
                        <label for="ep-hide-num">Tiles</label>
                        <span class="ep-unit">m</span>
                      </div>
                      <div class="ep-slider-row">
                        <input id="ep-hide-range" class="ep-range" type="range" min="0" max="300" step="5" />
                        <input id="ep-hide-num" class="ep-num ep-num-sm" type="number" min="0" max="500" step="1" />
                      </div>
                    </div>
                  </section>

                  <div class="ep-actions">
                    <button type="button" id="ep-copy" class="ep-btn ep-btn-ghost">Copiar</button>
                    <a id="ep-open-maps" class="ep-btn ep-btn-ghost" target="_blank" rel="noopener">Maps</a>
                  </div>
                </div>
                <div
                  class="split-handle split-handle-row split-handle-y-end"
                  id="split-earth-h"
                  role="separator"
                  aria-orientation="horizontal"
                  aria-label="Altura do painel de posição"
                  title="Arraste para redimensionar. Duplo clique restaura."
                  tabindex="0"
                ></div>
              </aside>

              <div id="import-overlay" class="import-overlay">
                <div class="import-card" id="btn-import-pick" role="button" tabindex="0">
                  <div class="import-visual" aria-hidden="true">
                    <img src="/brand/symbol-color.svg" width="72" height="54" alt="" />
                  </div>
                  <h3>IFC</h3>
                </div>
              </div>

              <div id="drop-veil" class="drop-veil" hidden>
                <div class="drop-veil-card">
                  <img src="/brand/symbol-color.svg" width="72" height="54" alt="" />
                  <span>IFC</span>
                </div>
              </div>

              <div id="loader-overlay" class="loader-overlay hidden">
                <div class="loader-card">
                  <div class="spinner" aria-hidden="true"></div>
                  <div id="loader-text" class="loader-text">A abrir</div>
                  <p class="loader-hint" id="loader-hint"></p>
                </div>
              </div>
            </div>

            <div class="timeline-slot" id="timeline-slot">
              <div
                class="split-handle split-handle-row"
                id="split-timeline"
                role="separator"
                aria-orientation="horizontal"
                aria-label="Altura da linha do tempo"
                title="Arraste para redimensionar. Duplo clique restaura."
                tabindex="0"
              ></div>
              <footer id="timeline" class="timeline-dock is-idle" aria-disabled="true"></footer>
            </div>
          </div>
          <div
            class="split-handle split-handle-grid"
            id="split-view-sets"
            role="separator"
            aria-orientation="vertical"
            aria-label="Largura da árvore IFC"
            title="Arraste para redimensionar. Duplo clique restaura."
            tabindex="0"
          ></div>
          <aside id="model-sets" class="model-sets" hidden aria-label="Árvore IFC e conjuntos 4D">
            <header class="model-sets-head">
              <div>
                <h2>IFC</h2>
                <p id="model-sets-count"></p>
              </div>
              <button
                type="button"
                class="panel-collapse"
                id="toggle-model-sets"
                title="Ocultar árvore IFC"
                aria-label="Ocultar árvore IFC"
                aria-controls="model-sets"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M10 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </header>
            <div class="model-sets-tabs" role="tablist">
              <button type="button" class="is-active" data-ms-tab="tree" role="tab" aria-selected="true">Árvore</button>
              <button type="button" data-ms-tab="sets" role="tab" aria-selected="false">Conjuntos</button>
            </div>
            <div class="model-sets-search">
              <input type="search" id="ifc-tree-search" placeholder="Filtrar" autocomplete="off" />
            </div>
            <div class="model-sets-body" data-ms-pane="tree">
              <div id="ifc-tree" class="ifc-tree"></div>
            </div>
            <div class="model-sets-body is-hidden" data-ms-pane="sets">
              <div class="model-sets-actions">
                <button type="button" class="btn-primary" id="btn-new-set-panel">Novo</button>
              </div>
              <div id="selection-sets" class="selection-sets"></div>
            </div>
          </aside>
          <div id="layout-restore" class="layout-restore" hidden>
            <button type="button" class="layout-chip" data-restore="schedule" hidden>Cronograma</button>
            <button type="button" class="layout-chip" data-restore="inspector" hidden>Propriedades</button>
            <button type="button" class="layout-chip" data-restore="timeline" hidden>Linha do tempo</button>
            <button type="button" class="layout-chip" data-restore="gantt" hidden>Gantt</button>
            <button type="button" class="layout-chip" data-restore="sets" hidden>Árvore IFC</button>
            <button type="button" class="layout-chip" data-restore="hud" hidden>Gráfico 5D</button>
            <button type="button" class="layout-chip" data-restore="earth" hidden>Posição</button>
          </div>
        </section>

        <aside id="inspector" class="panel panel-inspector is-readonly">
          <div
            class="split-handle split-handle-start"
            id="split-inspector"
            role="separator"
            aria-orientation="vertical"
            aria-label="Largura das propriedades"
            title="Arraste para redimensionar. Duplo clique restaura."
            tabindex="0"
          ></div>
          <div class="inspector-head">
            <div class="inspector-head-main">
              <h2 class="panel-title">Tarefa</h2>
              <span class="inspector-count" id="inspector-count" title="Elementos 3D associados">0</span>
            </div>
            <button
              type="button"
              class="icon-btn-plain"
              id="toggle-inspector-panel"
              title="Ocultar"
              aria-label="Ocultar"
              aria-controls="inspector"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M10 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div id="inspector-empty" class="inspector-empty">
            <div class="empty-visual" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none">
                <rect x="10" y="12" width="44" height="40" rx="8" stroke="currentColor" stroke-width="1.6" opacity="0.35"/>
                <path d="M20 24h24M20 32h16M20 40h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
              </svg>
            </div>
            <h3>Seleção</h3>
            <p id="inspector-empty-copy" class="sr-only"></p>
          </div>
          <div id="inspector-body" class="inspector-body is-hidden">
            <div class="insp-hero">
              <div id="prop-state" class="insp-status">—</div>
            </div>
            <form id="inspector-form" class="insp-form" autocomplete="off" aria-readonly="true">
              <section class="insp-section">
                <h3 class="insp-section-title">Geral</h3>
                <label class="insp-field">
                  <span>Nome</span>
                  <input id="prop-name" type="text" spellcheck="false" readonly tabindex="-1" />
                </label>
                <label class="insp-field">
                  <span>Identificação</span>
                  <input id="prop-ident" type="text" spellcheck="false" readonly tabindex="-1" />
                </label>
              </section>
              <section class="insp-section">
                <h3 class="insp-section-title">Tempo</h3>
                <div class="insp-dates">
                  <label class="insp-field">
                    <span>Início</span>
                    <input id="prop-start" type="date" readonly disabled tabindex="-1" />
                  </label>
                  <label class="insp-field">
                    <span>Fim</span>
                    <input id="prop-end" type="date" readonly disabled tabindex="-1" />
                  </label>
                </div>
                <div class="insp-readonly">
                  <span class="insp-label">Duração</span>
                  <span id="prop-duration" class="insp-value">—</span>
                </div>
              </section>
              <section class="insp-section">
                <h3 class="insp-section-title">5D</h3>
                <label class="insp-field">
                  <span>Custo</span>
                  <input id="prop-cost" type="number" step="0.01" min="0" inputmode="decimal" placeholder="" readonly disabled tabindex="-1" />
                </label>
                <div class="insp-readonly is-hidden" id="prop-cost-roll-row">
                  <span class="insp-label">Subtarefas</span>
                  <span id="prop-cost-roll" class="insp-value">—</span>
                </div>
              </section>
              <section class="insp-section">
                <h3 class="insp-section-title">3D</h3>
                <div class="insp-readonly">
                  <span class="insp-label">Elementos 3D</span>
                  <span id="prop-products" class="insp-value">—</span>
                </div>
              </section>
              <p id="prop-date-error" class="insp-error is-hidden" role="alert"></p>
              <p id="insp-hint" class="insp-hint sr-only"></p>
            </form>
          </div>
        </aside>
      </div>
      </div>
